# TarelGo CaptchAI - Apache part of the chain: Apache -> uvicorn 127.0.0.1:8008.
#
# Required modules:  a2enmod proxy proxy_http headers
# Place into:        /etc/apache2/sites-available/tarelgo-captchai.conf
# Enable with:       a2ensite tarelgo-captchai && systemctl reload apache2

<VirtualHost 127.0.0.1:8080>
    ServerName demo.tarelgo.com              # <-- your public domain

    # Keep the public Host header: Web Bot Auth signs @authority over it.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8008/ retry=0
    ProxyPassReverse / http://127.0.0.1:8008/

    # The app reads the original scheme through X-Forwarded-Proto.
    RequestHeader set X-Forwarded-Proto "http"

    # mod_proxy appends the peer address to X-Forwarded-For automatically;
    # the service resolves the real client IP by walking the list from the
    # right and skipping trusted proxies (127.0.0.1 by default).

    ErrorLog  ${APACHE_LOG_DIR}/tarelgo-captchai-error.log
    CustomLog ${APACHE_LOG_DIR}/tarelgo-captchai-access.log combined
</VirtualHost>
