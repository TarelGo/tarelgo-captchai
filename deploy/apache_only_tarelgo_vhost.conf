# TarelGo CaptchAI behind Apache ONLY (no nginx in the chain).
#   Internet -> Apache :443 -> uvicorn 127.0.0.1:8008
#
# Required modules:  a2enmod proxy proxy_http ssl headers
# Place into:        /etc/apache2/sites-available/tarelgo-captchai.conf

<VirtualHost *:443>
    ServerName demo.tarelgo.com              # <-- your public domain

    SSLEngine on
    SSLCertificateFile     /etc/letsencrypt/live/demo.tarelgo.com/fullchain.pem
    SSLCertificateKeyFile  /etc/letsencrypt/live/demo.tarelgo.com/privkey.pem
    SSLProtocol            all -SSLv3 -TLSv1 -TLSv1.1

    ProxyPreserveHost On                   # keep the public authority!
    ProxyPass        / http://127.0.0.1:8008/ retry=0
    ProxyPassReverse / http://127.0.0.1:8008/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/tarelgo-captchai-error.log
    CustomLog ${APACHE_LOG_DIR}/tarelgo-captchai-access.log combined
</VirtualHost>

# Plain-HTTP redirect to TLS (standard public behavior).
<VirtualHost *:80>
    ServerName demo.tarelgo.com
    Redirect permanent / https://demo.tarelgo.com/
</VirtualHost>
