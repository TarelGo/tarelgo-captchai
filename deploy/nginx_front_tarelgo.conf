# TarelGo CaptchAI behind the full chain: nginx (front) -> Apache (backend) -> uvicorn.
#
# Traffic path:            Internet -> nginx :443 -> Apache :8080 -> uvicorn 127.0.0.1:8008
# This file:               the nginx FRONT part (public TLS terminator).
# Pair it with:            deploy/apache_tarelgo_vhost.conf (the Apache part).
#
# Why each hop matters for TarelGo CaptchAI:
#   - Host / X-Forwarded-* must survive BOTH hops unchanged, otherwise
#     RFC 9421 @authority verification will reject valid agents.

server {
    listen 80;
    listen 443 ssl;
    server_name demo.tarelgo.com;              # <-- your public domain

    ssl_certificate     /etc/letsencrypt/live/demo.tarelgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.tarelgo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Real client IP travels to Apache in X-Forwarded-For.
    location / {
        proxy_pass http://127.0.0.1:8080;      # Apache backend
        proxy_set_header Host $host;           # keep the public authority!
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}

# ---------------------------------------------------------------------------
# OPTIONAL: JA3 TLS fingerprints (detection category "tls", weight 3).
# Requires the nginx-ssl-ja3 module; otherwise the signal stays disabled,
# which is the documented graceful default.
#
#   location / {
#       proxy_set_header X-JA3-Hash $ja3_hash;
#       ...
#   }
# Then set TARELGO_CAPTCHAI_JA3_LIST_FILE=/opt/tarelgo-captchai/ja3-blacklist.txt
# ---------------------------------------------------------------------------
