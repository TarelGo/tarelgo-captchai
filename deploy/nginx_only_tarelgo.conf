# TarelGo CaptchAI behind nginx ONLY (no Apache in the chain).
#   Internet -> nginx :443 -> uvicorn 127.0.0.1:8008
#
# Maintainability note (as requested): the service itself is proxy-agnostic.
# Whether you run nginx -> Apache -> uvicorn, nginx -> uvicorn, Apache ->
# uvicorn, or uvicorn directly, the only contract is: pass Host and the
# X-Forwarded-* headers from the trusted hop, and keep
# TARELGO_CAPTCHAI_TRUSTED_PROXIES in sync with the direct peer address.

server {
    listen 80;
    listen 443 ssl;
    server_name demo.tarelgo.com;              # <-- your public domain

    ssl_certificate     /etc/letsencrypt/live/demo.tarelgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.tarelgo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8008;      # uvicorn directly
        proxy_set_header Host $host;           # keep the public authority!
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
